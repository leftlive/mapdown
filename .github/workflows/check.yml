name: Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # The public snapshot has no tests/, so run the checks that need only src/.
      - run: npm run typecheck
      - run: npx eslint src
      - run: npm run build
